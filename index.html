<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zork 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', Courier, monospace;
  }

  #scene-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  #ui-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    box-sizing: border-box;
    padding: 16px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0.75) 70%, rgba(0,0,0,0));
    color: #d8f5d8;
    pointer-events: none;
  }

  #room-name {
    margin: 0 0 6px 0;
    font-size: 20px;
    font-weight: bold;
    color: #9fffa0;
    text-shadow: 0 0 6px rgba(80, 255, 80, 0.5);
    letter-spacing: 1px;
  }

  #room-text {
    margin: 0 0 12px 0;
    font-size: 15px;
    line-height: 1.4;
    max-width: 800px;
    color: #d8f5d8;
    white-space: pre-line;
  }

  #controls-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    pointer-events: all;
  }

  .dir-btn {
    background: rgba(20, 40, 20, 0.8);
    border: 1px solid #4caf50;
    color: #d8f5d8;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.15s ease;
  }

  .dir-btn:hover {
    background: rgba(76, 175, 80, 0.4);
  }

  .dir-btn:disabled {
    opacity: 0.25;
    cursor: default;
  }

  .dir-btn:disabled:hover {
    background: rgba(20, 40, 20, 0.8);
  }

  #command-form {
    display: flex;
    gap: 8px;
    margin-left: auto;
    pointer-events: all;
  }

  #command-input {
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid #4caf50;
    color: #d8f5d8;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 3px;
    width: 220px;
  }

  #command-input:focus {
    outline: none;
    box-shadow: 0 0 6px rgba(76, 175, 80, 0.6);
  }

  #command-submit {
    background: rgba(20, 40, 20, 0.8);
    border: 1px solid #4caf50;
    color: #d8f5d8;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 3px;
  }

  #command-submit:hover {
    background: rgba(76, 175, 80, 0.4);
  }
</style>
</head>
<body>

<div id="scene-container"></div>

<div id="ui-overlay">
  <h1 id="room-name">-</h1>
  <p id="room-text">Loading...</p>
  <div id="controls-row">
    <button class="dir-btn" data-dir="north">North</button>
    <button class="dir-btn" data-dir="south">South</button>
    <button class="dir-btn" data-dir="east">East</button>
    <button class="dir-btn" data-dir="west">West</button>
    <button class="dir-btn" data-dir="up">Up</button>
    <button class="dir-btn" data-dir="down">Down</button>
    <form id="command-form">
      <input id="command-input" type="text" placeholder="type a command..." autocomplete="off">
      <button id="command-submit" type="submit">Go</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* =========================================================================
   1. GAME STATE
   ========================================================================= */
const gameState = {
  current_room: 'west_of_house',
  inventory: [],
  has_lamp_lit: false,
  flags: {
    mailbox_open: false,
    trapdoor_locked: true
  }
};

/* =========================================================================
   ITEM DATA DICTIONARY
   `location` is one of: a room id (dropped on the floor there), 'mailbox'
   (sitting inside the mailbox, only reachable while it's open), or
   'inventory' (carried by the player).
   ========================================================================= */
const items = {
  leaflet: {
    id: 'leaflet',
    name: 'leaflet',
    description: "A small paper leaflet.",
    readText: "\"WELCOME TO ZORK!\n\nZORK is a game of adventure, danger, and low cunning. In it you will explore some of the most amazing territory ever seen by mortals. No computer should be without one!\"",
    portable: true,
    location: 'mailbox'
  }
};

/* =========================================================================
   THREE.JS CORE SETUP
   ========================================================================= */
const container = document.getElementById('scene-container');

const SKY_COLOR = 0x87ceeb;

// Height of the player's eyes above whatever ground a room builds beneath
// them. Every room is authored as a stage set around the fixed camera at
// the origin, so this is the one shared constant that keeps floors,
// buildings, etc. lining up with the camera from room to room.
const EYE_HEIGHT = 1.6;

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
scene.fog = new THREE.Fog(SKY_COLOR, 20, 60);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting shared across all rooms
const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444422, 1.0);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
sunLight.position.set(8, 12, 6);
scene.add(sunLight);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =========================================================================
   2. ROOM DATA DICTIONARY
   ========================================================================= */
const rooms = {

  west_of_house: {
    id: 'west_of_house',
    name: 'West of House',
    text: "You are standing in an open field west of a white house, with a boarded front door. There is a small mailbox here, and a wooden trapdoor is set into the ground nearby.",
    exits: {
      north: 'north_of_house',
      east: null, // front door is boarded - blocked for now
      down: 'cellar'
    },
    // Movement guards: run before an exit is taken. Returning a string
    // blocks the move and shows that message instead; returning null/undefined
    // lets it through.
    exitGuards: {
      down: () => (gameState.flags.trapdoor_locked ? "The trapdoor is closed." : null)
    },
    // Built as a stage set around the fixed camera at (0,0,0): the ground
    // sits EYE_HEIGHT below the player, everything else stacks up from there.
    render3D: function(sceneRef) {
      const group = new THREE.Group();
      const groundY = -EYE_HEIGHT;

      // Ground - green field
      const groundGeo = new THREE.PlaneGeometry(40, 40);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x3c8f3c });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = groundY;
      group.add(ground);

      // House - white block, resting on the ground, 10 units ahead
      const houseGeo = new THREE.BoxGeometry(6, 4, 5);
      const houseMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const house = new THREE.Mesh(houseGeo, houseMat);
      house.position.set(0, groundY + 2, -10);
      group.add(house);

      // Roof - simple low-poly cone
      const roofGeo = new THREE.ConeGeometry(4.5, 2, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4a3c });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.rotation.y = Math.PI / 4;
      roof.position.set(0, groundY + 5, -10);
      group.add(roof);

      // Mailbox - tiny red box just off to the side, near the player
      const mailboxGeo = new THREE.BoxGeometry(0.4, 0.5, 0.3);
      const mailboxMat = new THREE.MeshStandardMaterial({ color: 0xaa2222 });
      const mailbox = new THREE.Mesh(mailboxGeo, mailboxMat);
      mailbox.position.set(2, groundY + 0.85, -3);
      group.add(mailbox);

      // Mailbox post
      const postGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 6);
      const postMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2a });
      const post = new THREE.Mesh(postGeo, postMat);
      post.position.set(2, groundY + 0.3, -3);
      group.add(post);

      // Mailbox lid - flat when closed, flipped up against the back when open
      const lidGeo = new THREE.BoxGeometry(0.4, 0.05, 0.3);
      const lidMat = new THREE.MeshStandardMaterial({ color: 0x8b1f1f });
      const lid = new THREE.Mesh(lidGeo, lidMat);
      if (gameState.flags.mailbox_open) {
        lid.position.set(2, groundY + 1.15, -3.13);
        lid.rotation.x = Math.PI / 2.2;
      } else {
        lid.position.set(2, groundY + 1.13, -3);
      }
      group.add(lid);

      // Leaflet - only visible poking out once the mailbox is open
      if (gameState.flags.mailbox_open && items.leaflet.location === 'mailbox') {
        const leafletGeo = new THREE.BoxGeometry(0.25, 0.02, 0.18);
        const leafletMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const leafletMesh = new THREE.Mesh(leafletGeo, leafletMat);
        leafletMesh.position.set(2, groundY + 0.8, -3);
        group.add(leafletMesh);
      }

      // Trapdoor - flush with the ground when closed, propped open on end
      // when unlocked, revealing the passage down into the cellar.
      const trapdoorGeo = new THREE.BoxGeometry(1.2, 0.1, 1.2);
      const trapdoorMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2f });
      const trapdoor = new THREE.Mesh(trapdoorGeo, trapdoorMat);
      if (gameState.flags.trapdoor_locked) {
        trapdoor.position.set(-2, groundY + 0.05, -4);
      } else {
        trapdoor.rotation.z = Math.PI / 2.3;
        trapdoor.position.set(-2.5, groundY + 0.6, -4);
      }
      group.add(trapdoor);

      sceneRef.add(group);
      return group;
    }
  },

  north_of_house: {
    id: 'north_of_house',
    name: 'North of House',
    text: "You are facing the north side of a white house. There is no door here, and all the windows are boarded up. To the north a narrow path winds through the trees.",
    exits: {
      south: 'west_of_house'
    },
    render3D: function(sceneRef) {
      const group = new THREE.Group();
      const groundY = -EYE_HEIGHT;

      // Ground - slightly darker, path-worn field
      const groundGeo = new THREE.PlaneGeometry(40, 40);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x357a35 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = groundY;
      group.add(ground);

      // House - same white block, seen from the other side
      const houseGeo = new THREE.BoxGeometry(6, 4, 5);
      const houseMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const house = new THREE.Mesh(houseGeo, houseMat);
      house.position.set(0, groundY + 2, -10);
      group.add(house);

      const roofGeo = new THREE.ConeGeometry(4.5, 2, 4);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4a3c });
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.rotation.y = Math.PI / 4;
      roof.position.set(0, groundY + 5, -10);
      group.add(roof);

      // A couple of low-poly trees to suggest the forest path north
      function makeTree(x, z) {
        const t = new THREE.Group();
        const trunkGeo = new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6);
        const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2a });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 0.6;
        t.add(trunk);

        const topGeo = new THREE.ConeGeometry(0.8, 1.8, 6);
        const topMat = new THREE.MeshStandardMaterial({ color: 0x2e6b2e });
        const top = new THREE.Mesh(topGeo, topMat);
        top.position.y = 1.7;
        t.add(top);

        t.position.set(x, groundY, z);
        return t;
      }

      group.add(makeTree(-4, -6));
      group.add(makeTree(4.5, -5));
      group.add(makeTree(-3, -2));

      sceneRef.add(group);
      return group;
    }
  },

  cellar: {
    id: 'cellar',
    name: 'Cellar',
    text: "You are in a dark and musty cellar. A dirt floor and rough stone walls surround you. A passage leads up.",
    dark: true,
    exits: {
      up: 'west_of_house'
    },
    render3D: function(sceneRef) {
      const group = new THREE.Group();
      const groundY = -EYE_HEIGHT;

      const floorGeo = new THREE.PlaneGeometry(10, 10);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a3f30 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = groundY;
      group.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x555550 });
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 3, 0.3), wallMat);
      backWall.position.set(0, groundY + 1.5, -6);
      group.add(backWall);

      const sideWallGeo = new THREE.BoxGeometry(0.3, 3, 10);
      const leftWall = new THREE.Mesh(sideWallGeo, wallMat);
      leftWall.position.set(-5, groundY + 1.5, -1);
      group.add(leftWall);

      const rightWall = new THREE.Mesh(sideWallGeo, wallMat);
      rightWall.position.set(5, groundY + 1.5, -1);
      group.add(rightWall);

      sceneRef.add(group);
      return group;
    }
  }

};

/* =========================================================================
   3. TRANSITION ENGINE
   ========================================================================= */
let currentRoomGroup = null;

function clearCurrentRoom() {
  if (currentRoomGroup) {
    scene.remove(currentRoomGroup);
    currentRoomGroup.traverse((obj) => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach((m) => m.dispose());
        } else {
          obj.material.dispose();
        }
      }
    });
    currentRoomGroup = null;
  }
}

// Every room is its own stage: the camera never travels through a shared
// world, it just snaps back to a fixed neutral seat and the old set is torn
// down before the new one goes up.
function resetCameraToOrigin() {
  camera.position.set(0, 0, 0);
  camera.up.set(0, 1, 0);
  camera.lookAt(0, 0, -1);
}

function setMessage(text) {
  document.getElementById('room-text').textContent = text;
}

function isRoomDark(room) {
  return !!room.dark && !gameState.has_lamp_lit;
}

// Applies lighting + text + exit buttons for the current room. Called on
// room entry, and again whenever the lamp is toggled without moving.
function applyRoomState() {
  const room = rooms[gameState.current_room];
  const dark = isRoomDark(room);

  hemiLight.visible = !dark;
  sunLight.visible = !dark;
  scene.background.set(dark ? 0x000000 : SKY_COLOR);
  scene.fog.color.set(dark ? 0x000000 : SKY_COLOR);

  if (dark) {
    document.getElementById('room-name').textContent = 'Pitch Black';
    setMessage("It is pitch black. You are likely to be eaten by a grue.");
  } else {
    document.getElementById('room-name').textContent = room.name;
    setMessage(room.text);
  }

  document.querySelectorAll('.dir-btn').forEach((btn) => {
    const dir = btn.getAttribute('data-dir');
    btn.disabled = !room.exits[dir];
  });
}

// Rebuilds the current room's meshes in place, without touching the room
// text - used when an interaction (opening the mailbox, taking an item)
// changes what a room looks like but doesn't move the player.
function rebuildCurrentRoomVisuals() {
  const room = rooms[gameState.current_room];
  clearCurrentRoom();
  resetCameraToOrigin();
  currentRoomGroup = room.render3D(scene);
}

function goToRoom(roomId) {
  const room = rooms[roomId];
  if (!room) {
    console.warn('Unknown room:', roomId);
    return;
  }

  clearCurrentRoom();
  resetCameraToOrigin();
  currentRoomGroup = room.render3D(scene);

  gameState.current_room = room.id;

  applyRoomState();
}

function setLampLit(lit) {
  gameState.has_lamp_lit = lit;
  applyRoomState();
}

function tryMove(direction) {
  const room = rooms[gameState.current_room];
  const targetId = room.exits[direction];
  if (!targetId) {
    setMessage("You can't go that way.");
    return;
  }

  const guard = room.exitGuards && room.exitGuards[direction];
  const blockedMessage = guard && guard();
  if (blockedMessage) {
    setMessage(blockedMessage);
    return;
  }

  goToRoom(targetId);
}

/* =========================================================================
   ITEM / CONTAINER INTERACTIONS
   ========================================================================= */
function findItemByName(name) {
  return Object.values(items).find((item) => item.name === name);
}

// Is this item somewhere the player can currently reach (room floor, an
// open container in this room, or already in hand)?
function isItemReachable(item) {
  if (item.location === 'inventory') return true;
  if (item.location === gameState.current_room) return true;
  if (item.location === 'mailbox') {
    return gameState.current_room === 'west_of_house' && gameState.flags.mailbox_open;
  }
  return false;
}

function describeMailbox() {
  if (!gameState.flags.mailbox_open) {
    return "The small mailbox is closed.";
  }
  return items.leaflet.location === 'mailbox'
    ? "The small mailbox is open. Inside is a leaflet."
    : "The small mailbox is open and empty.";
}

function handleOpen(noun) {
  if (noun === 'mailbox') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a mailbox here.");
    } else if (gameState.flags.mailbox_open) {
      setMessage("It is already open.");
    } else {
      gameState.flags.mailbox_open = true;
      rebuildCurrentRoomVisuals();
      setMessage("Opening the small mailbox reveals a leaflet.");
    }
    return;
  }
  if (noun === 'trapdoor') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a trapdoor here.");
    } else if (!gameState.flags.trapdoor_locked) {
      setMessage("It is already open.");
    } else {
      gameState.flags.trapdoor_locked = false;
      rebuildCurrentRoomVisuals();
      setMessage("You heave the trapdoor open, revealing a passage down into darkness.");
    }
    return;
  }
  setMessage("You can't open that.");
}

function handleClose(noun) {
  if (noun === 'mailbox') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a mailbox here.");
    } else if (!gameState.flags.mailbox_open) {
      setMessage("It is already closed.");
    } else {
      gameState.flags.mailbox_open = false;
      rebuildCurrentRoomVisuals();
      setMessage("Closed.");
    }
    return;
  }
  if (noun === 'trapdoor') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a trapdoor here.");
    } else if (gameState.flags.trapdoor_locked) {
      setMessage("It is already closed.");
    } else {
      gameState.flags.trapdoor_locked = true;
      rebuildCurrentRoomVisuals();
      setMessage("You lower the trapdoor closed.");
    }
    return;
  }
  setMessage("You can't close that.");
}

function handleTake(noun) {
  const item = findItemByName(noun);
  if (!item || !isItemReachable(item)) {
    setMessage("You can't see that here.");
    return;
  }
  if (item.location === 'inventory') {
    setMessage("You already have that.");
    return;
  }
  if (!item.portable) {
    setMessage("You can't take that.");
    return;
  }
  item.location = 'inventory';
  gameState.inventory.push(item.id);
  rebuildCurrentRoomVisuals();
  setMessage("Taken.");
}

function handleDrop(noun) {
  const item = findItemByName(noun);
  if (!item || item.location !== 'inventory') {
    setMessage("You're not carrying that.");
    return;
  }
  item.location = gameState.current_room;
  gameState.inventory = gameState.inventory.filter((id) => id !== item.id);
  rebuildCurrentRoomVisuals();
  setMessage("Dropped.");
}

function handleExamine(noun) {
  if (noun === 'mailbox') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a mailbox here.");
    } else {
      setMessage(describeMailbox());
    }
    return;
  }
  if (noun === 'trapdoor') {
    if (gameState.current_room !== 'west_of_house') {
      setMessage("You don't see a trapdoor here.");
    } else {
      setMessage(gameState.flags.trapdoor_locked
        ? "A closed wooden trapdoor is set into the ground."
        : "The open trapdoor reveals a passage leading down into darkness.");
    }
    return;
  }
  const item = findItemByName(noun);
  if (item && isItemReachable(item)) {
    setMessage(item.description);
    return;
  }
  setMessage("You don't see that here.");
}

function handleRead(noun) {
  const item = findItemByName(noun);
  if (!item || !isItemReachable(item)) {
    setMessage("You don't see that here.");
    return;
  }
  setMessage(item.readText || "There's nothing written on it.");
}

function handleInventory() {
  if (gameState.inventory.length === 0) {
    setMessage("You are empty-handed.");
    return;
  }
  const names = gameState.inventory.map((id) => items[id].name).join(', ');
  setMessage(`You are carrying: ${names}.`);
}

/* =========================================================================
   INPUT HANDLING
   ========================================================================= */
document.querySelectorAll('.dir-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    tryMove(btn.getAttribute('data-dir'));
  });
});

document.getElementById('command-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('command-input');
  const cmd = input.value.trim().toLowerCase();
  input.value = '';
  if (!cmd) return;

  const directionAliases = {
    n: 'north', north: 'north',
    s: 'south', south: 'south',
    e: 'east', east: 'east',
    w: 'west', west: 'west',
    u: 'up', up: 'up',
    d: 'down', down: 'down'
  };

  const lampOnCommands = ['light lamp', 'turn on lamp', 'light the lamp'];
  const lampOffCommands = ['turn off lamp', 'extinguish lamp', 'douse lamp'];

  if (directionAliases[cmd]) {
    tryMove(directionAliases[cmd]);
    return;
  }
  if (cmd === 'look') {
    applyRoomState();
    return;
  }
  if (cmd === 'inventory' || cmd === 'i' || cmd === 'inv') {
    handleInventory();
    return;
  }
  if (cmd === 'help') {
    setMessage(
      "Commands: north/south/east/west/up/down (or n/s/e/w/u/d), look, " +
      "examine <thing>, open/close <thing>, take/drop <thing>, read <thing>, " +
      "inventory, light lamp / turn off lamp."
    );
    return;
  }
  if (lampOnCommands.includes(cmd)) {
    setLampLit(true);
    return;
  }
  if (lampOffCommands.includes(cmd)) {
    setLampLit(false);
    return;
  }

  const words = cmd.split(/\s+/);
  const verb = words[0];
  const skipAt = verb === 'look' && words[1] === 'at' ? 2 : 1;
  const noun = words.slice(skipAt).join(' ').replace(/^the\s+/, '').trim();

  switch (verb) {
    case 'open':
      handleOpen(noun);
      break;
    case 'close':
      handleClose(noun);
      break;
    case 'take':
    case 'get':
      handleTake(noun);
      break;
    case 'drop':
      handleDrop(noun);
      break;
    case 'examine':
    case 'x':
    case 'look':
      handleExamine(noun);
      break;
    case 'read':
      handleRead(noun);
      break;
    default:
      setMessage("I don't understand that command.");
  }
});

// Also allow raw arrow-key / WASD movement for convenience
window.addEventListener('keydown', (e) => {
  const keyMap = {
    ArrowUp: 'north', w: 'north', W: 'north',
    ArrowDown: 'south', s: 'south', S: 'south',
    ArrowRight: 'east', d: 'east', D: 'east',
    ArrowLeft: 'west', a: 'west', A: 'west'
  };
  const active = document.activeElement;
  const typingInInput = active && active.id === 'command-input';
  if (!typingInInput && keyMap[e.key]) {
    tryMove(keyMap[e.key]);
  }
});

/* =========================================================================
   RENDER LOOP
   ========================================================================= */
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

goToRoom(gameState.current_room);
animate();

</script>
</body>
</html>
